name: Generate Snake Animation

# PAUSED on 2026-11-18.
# Every run since 2026-11-07 fails at job setup with:
#   "The job was not started because your account is locked due to a billing issue."
# Fix: GitHub -> Settings -> Billing and plans (clear the failed payment / spending
# limit), then uncomment the `schedule` and `push` triggers below to resume.
on:
  # schedule:
  #   - cron: "0 */12 * * *"
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "itsmejay18"
          git config --global user.email "jayjeminoababon@gmail.com"

      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: itsmejay18
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animation"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
